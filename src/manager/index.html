dialog{background:#f9fcff;border:1px solid #d8e7f1;border-radius:18px;box-shadow:0 24px 72px #16344e38,inset 0 1px 0 #fff}dialog::backdrop{background:#233e5566;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.toast{background:#244e65;border:1px solid #5d879e;box-shadow:0 8px 24px #16344e35}
.reservation-workspace{background:transparent;border-radius:16px}
/* Booking workspace uses utility components, kept within its existing layout. */
body:has([data-slot=card]) [data-slot=card]{background:#ffffffdc;border-color:#cbdfea;border-radius:16px;box-shadow:0 6px 22px #34546e0d,inset 0 1px 0 #fff}
[data-slot=button]{border:1px solid #c3d8e7;border-radius:10px;box-shadow:3px 3px 8px #476a8317,inset 0 1px 0 #ffffff66}
[data-slot=button][data-variant=outline],[data-slot=button][data-variant=secondary]{background:linear-gradient(145deg,#fff,#eaf2f8);color:#335b73}
[data-slot=button][data-variant=default]{background:linear-gradient(140deg,#376e8a,#28566f);color:white;border-color:#244e65}
[data-slot=tabs-list]{background:#e7eff6;box-shadow:var(--ys-inset);border:1px solid #d5e2ec;border-radius:12px}
[data-slot=tabs-trigger][data-state=active]{background:#f8fcff;color:#285f80;box-shadow:2px 3px 7px #34546e17;border-radius:8px}
[data-slot=dialog-content],[data-slot=alert-dialog-content]{background:#f9fcff;border:1px solid #d8e7f1;border-radius:18px;box-shadow:0 24px 72px #16344e38}
@media(max-width:700px){.card,.tablewrap,.student-directory-tools{border-radius:13px}.btn,[data-slot=button]{min-height:40px}.card,.stats>.card{box-shadow:0 3px 12px #34546e0b}.hero{border-radius:16px}input,select,textarea{font-size:16px}body>aside:not(.student-detail-panel){background:#f4faffed;box-shadow:0 3px 16px #34546e10}}
@supports not (backdrop-filter:blur(1px)){body>aside:not(.student-detail-panel),main>header{background:#f5faff}.card{background:#fdfefe}}
@media(prefers-reduced-transparency:reduce){body>aside:not(.student-detail-panel),main>header,.card,.stats>.card{background:#f5faff;backdrop-filter:none;-webkit-backdrop-filter:none}dialog::backdrop{backdrop-filter:none;-webkit-backdrop-filter:none}}
@media(prefers-reduced-motion:reduce){.btn,body>aside #nav button{transition:none}}
@media(forced-colors:active){.btn,.card,.tablewrap,[data-slot=button]{box-shadow:none;border:1px solid ButtonText}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid Highlight}}
@media print{body,.card,.hero,main>header{background:white;box-shadow:none;backdrop-filter:none}}
